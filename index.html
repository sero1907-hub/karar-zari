<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sero'nun Karar Zarı</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #00fff5;
            font-size: 1.8rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 245, 0.4);
        }
        .presets {
            margin-bottom: 15px;
        }
        .preset-btn {
            background: #0f3460;
            border: 1px solid #00fff5;
            color: #00fff5;
            padding: 6px 12px;
            margin: 3px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .preset-btn:hover {
            background: #00fff5;
            color: #1a1a2e;
        }
        .scene {
            width: 200px;
            height: 200px;
            margin: 20px auto;
            perspective: 600px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(-100px) rotateX(0deg) rotateY(0deg);
            transition: transform 2.5s cubic-bezier(0.15, 0.85, 0.35, 1);
        }
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid #00fff5;
            background: #16213e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            padding: 10px;
            word-break: break-word;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 245, 0.2) inset;
        }
        .face.disabled {
            border-color: #4a5568;
            background: #1a202c;
            color: #4a5568;
            text-decoration: line-through;
            box-shadow: none;
        }
        .face1 { transform: rotateY(0deg) translateZ(100px); }
        .face2 { transform: rotateY(90deg) translateZ(100px); }
        .face3 { transform: rotateY(180deg) translateZ(100px); }
        .face4 { transform: rotateY(-90deg) translateZ(100px); }
        .face5 { transform: rotateX(90deg) translateZ(100px); }
        .face6 { transform: rotateX(-90deg) translateZ(100px); }
        
        .inputs {
            max-width: 400px;
            width: 100%;
            margin: 10px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        input[type="text"] {
            padding: 8px;
            background: #0f3460;
            border: 1px solid #00fff5;
            color: white;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:disabled {
            background: #1a202c;
            border-color: #4a5568;
            color: #4a5568;
        }
        .settings {
            margin: 15px 0;
            font-size: 13px;
            color: #00fff5;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .settings label {
            cursor: pointer;
            user-select: none;
        }
        button.roll-btn {
            margin-top: 5px;
            padding: 12px 35px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button.roll-btn:hover {
            background: #ff5270;
        }
        button.roll-btn:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 15px;
            font-size: 18px;
            color: #00fff5;
            font-weight: bold;
            min-height: 25px;
        }
        #roast {
            margin-top: 5px;
            font-size: 14px;
            color: #fb7185;
            font-style: italic;
            min-height: 25px;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <h1>KARAR ZARI</h1>

    <div class="presets">
        <span style="font-size: 13px; color: #a5b4fc; display: block; margin-bottom: 5px;">Hızlı Şablonlar:</span>
        <button class="preset-btn" onclick="setPreset(['Kahve Yap', '10 Şınav', 'Kod Yaz', 'Müzik Aç', 'Mola Ver', 'Yat Uyu'])">Girişken</button>
        <button class="preset-btn" onclick="setPreset(['Burger', 'Pizza', 'Lahmacun', 'Ev Yemeği', 'Çorba', 'Salata'])">Ne Yiyelim?</button>
        <button class="preset-btn" onclick="setPreset(['Sci-Fi', 'Komedi', 'Korku', 'Belgesel', 'Anime', 'Aksiyon'])">Film Türü</button>
        <button class="preset-btn" onclick="setPreset(['JavaScript', 'Python', 'React', 'Node.js', 'C++', 'Boş Gün'])">Hangi Dil?</button>
    </div>

    <div class="scene">
        <div class="cube" id="cube">
            <div class="face face1" id="f1">1</div>
            <div class="face face2" id="f2">2</div>
            <div class="face face3" id="f3">3</div>
            <div class="face face4" id="f4">4</div>
            <div class="face face5" id="f5">5</div>
            <div class="face face6" id="f6">6</div>
        </div>
    </div>

    <div id="result">Seçenekleri yaz ve zarı at!</div>
    <div id="roast"></div>

    <div class="inputs">
        <input type="text" id="i1" oninput="up(1)">
        <input type="text" id="i2" oninput="up(2)">
        <input type="text" id="i3" oninput="up(3)">
        <input type="text" id="i4" oninput="up(4)">
        <input type="text" id="i5" oninput="up(5)">
        <input type="text" id="i6" oninput="up(6)">
    </div>

    <div class="settings">
        <label><input type="checkbox" id="removeOnWin"> Çıkan bir daha çıkmasın</label>
        <label><input type="checkbox" id="soundToggle" checked> Sesler Açık</label>
        <label><input type="checkbox" id="confettiToggle" checked> Konfeti Açık</label>
    </div>
    
    <button class="roll-btn" onclick="roll()">ZARI AT</button>

    <script>
        const defaultValues = ['Kahve Yap', '10 Şınav', 'Kod Yaz', 'Müzik Aç', 'Mola Ver', 'Yat Uyu'];

        function loadValues() {
            for(let i = 1; i <= 6; i++) {
                const input = document.getElementById('i' + i);
                const saved = localStorage.getItem('sero_zar_v4_' + i);
                
                // Eğer kaydedilen değer dolu ve geçerliyse onu al, yoksa varsayılanı çak
                let val = (saved !== null && saved.trim() !== "") ? saved : defaultValues[i-1];
                input.value = val;
                input.disabled = false;
                up(i);
            }
        }

        function up(n) {
            const input = document.getElementById('i' + n);
            const val = input.value;
            const face = document.getElementById('f' + n);
            
            face.innerText = val ? val : `${n}. Boş`;
            
            if(!val || val.trim() === "") {
                face.classList.add('disabled');
            } else {
                face.classList.remove('disabled');
            }
            
            try {
                localStorage.setItem('sero_zar_v4_' + n, val);
            } catch(e) {}
        }

        function setPreset(arr) {
            for(let i = 0; i < 6; i++) {
                const input = document.getElementById('i' + (i+1));
                input.disabled = false;
                input.value = arr[i];
                up(i+1);
            }
            document.getElementById('result').innerText = "Yeni şablon yüklendi!";
            document.getElementById('roast').innerText = "Hadi bakalım Sero, görelim zoru seçme cesaretini!";
        }

        let currentX = 0;
        let currentY = 0;
        const cubeRotations = {
            1: {x: 0,   y: 0},
            2: {x: 0,   y: -90},
            3: {x: 0,   y: -180},
            4: {x: 0,   y: 90},
            5: {x: -90, y: 0},
            6: {x: 90,  y: 0}
        };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playRollSound() {
            if (!document.getElementById('soundToggle').checked) return;
            try {
                initAudio();
                const duration = 2.5;
                const bufferSize = audioCtx.sampleRate * duration;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 600;
                filter.Q.value = 4;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
            } catch(e) {}
        }

        function playSuccessSound() {
            if (!document.getElementById('soundToggle').checked) return;
            try {
                initAudio();
                const notes = [392.00, 523.25, 659.25, 783.99];
                const times = [0, 0.12, 0.24, 0.4];
                const durations = [0.1, 0.1, 0.1, 0.5];

                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + times[index]);
                    gain.gain.setValueAtTime(0, audioCtx.currentTime + times[index]);
                    gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + times[index] + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + times[index] + durations[index]);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + times[index]);
                    osc.stop(audioCtx.currentTime + times[index] + durations[index]);
                });
            } catch(e) {}
        }

        const roastMessages = [
            "Aferin Sero, kaderine yine şans eseri boyun eğdin.",
            "Bunu yapmazsan içimiz rahat etmeyecekti zaten, harika seçim!",
            "Zar bile senin kararsızlığından sıkıldı artık, rastgele bir şey seçti.",
            "Yine insanlığa büyük bir katkı sunmaktan kıl payı kurtuldun.",
            "İç sesin 'yapma' diyordu ama zar seni dinlemedi bile.",
            "Bunu başarabileceğine inanan bir tek sen vardın, zar bile şüpheliydi."
        ];

        let isRolling = false;

        function roll() {
            if (isRolling) return;

            let validFaces = [];
            for(let i = 1; i <= 6; i++) {
                const input = document.getElementById('i' + i);
                if(!input.disabled && input.value && input.value.trim() !== "") {
                    validFaces.push(i);
                }
            }

            if(validFaces.length === 0) {
                document.getElementById('result').innerText = "Tüm seçenekler bitti!";
                document.getElementById('roast').innerText = "Liste tükendi Sero, artık kendi kararlarını kendin vermen gerekecek!";
                return;
            }

            isRolling = true;
            document.getElementById('result').innerText = "Zar dönüyor...";
            document.getElementById('roast').innerText = "Bakalım bu sefer hangi bahaneyi seçeceksin...";
            
            playRollSound();

            const randomIndex = Math.floor(Math.random() * validFaces.length);
            const r = validFaces[randomIndex];
            
            currentX += 1800;
            currentY += 1800;

            const target = cubeRotations[r];
            document.getElementById('cube').style.transform = `translateZ(-100px) rotateX(${currentX + target.x}deg) rotateY(${currentY + target.y}deg)`;
            
            setTimeout(() => {
                playSuccessSound();
                
                if (document.getElementById('confettiToggle').checked && typeof confetti === 'function') {
                    try {
                        confetti({
                            particleCount: 100,
                            spread: 70,
                            origin: { y: 0.6 }
                        });
                    } catch(e) {}
                }

                const val = document.getElementById('i' + r).value;
                document.getElementById('result').innerText = "KAZANAN: " + val;
                
                const randomRoast = roastMessages[Math.floor(Math.random() * roastMessages.length)];
                document.getElementById('roast').innerText = `"${val}" çıktı! ${randomRoast}`;

                const removeChecked = document.getElementById('removeOnWin').checked;
                if(removeChecked) {
                    document.getElementById('i' + r).value = "";
                    document.getElementById('i' + r).disabled = true;
                    up(r);
                }

                isRolling = false;
            }, 2500);
        }

        // Sayfa açıldığında çalıştır
        loadValues();
    </script>
</body>
</html>
